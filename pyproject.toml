[project]
name = "oscilloscope-mcp"
version = "0.1.0"
description = "MCP server for bench oscilloscopes — give an AI agent a structured channel to observe physical pin behavior and close the RTL-sim/HW-fail gap."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "masahiro" }]
license = { text = "MIT" }
keywords = ["mcp", "oscilloscope", "scpi", "rigol", "ds1000z", "hardware-debug", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.0,<2",  # v2 renames FastMCP→MCPServer; server.py is v1-only
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# skills/scope-bench/scripts/plot.py PNG rendering; the script falls back
# to the zero-dependency HTML viewer when this is absent.
plot = [
    "matplotlib>=3.8",
]

[project.scripts]
oscilloscope-mcp = "oscilloscope_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oscilloscope_mcp.instruments.profiles" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
